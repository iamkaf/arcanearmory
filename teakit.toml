modId = "arcanearmory"
projectKey = "arcane-armory"

[defaults]
launcher = "gradle"
workingDirectory = "."
gradleWrapper = "./gradlew"
noDaemon = true
console = "plain"
maxWorkers = 1
configureOnDemand = false

[defaults.gradleProperties]
"arcanearmory.withTeaKit" = "true"

[defaults.systemProperties]
"arcanearmory.withTeaKit" = "true"
"teakit.enabled" = "true"
"teakit.autoWorld" = "true"
"teakit.runtimeApi.required" = "1"
"teakit.worldId" = "arcanearmory_teakit"
"teakit.worldName" = "Arcane Armory TeaKit"

[nodes."26.2-fabric"]
loader = "fabric"
minecraft = "26.2"
tasks = [":fabric:26.2:runClient"]
gameDirectory = "fabric/versions/26.2/runs/client"

[nodes."26.2-forge"]
loader = "forge"
minecraft = "26.2"
tasks = [":forge:26.2:runClient"]
gameDirectory = "forge/versions/26.2/run"

[nodes."26.2-forge".environment]
GLFW_PLATFORM = "x11"
XDG_SESSION_TYPE = "x11"
WAYLAND_DISPLAY = ""

[nodes."26.2-neoforge"]
loader = "neoforge"
minecraft = "26.2"
tasks = [":neoforge:26.2:runClient"]
gameDirectory = "neoforge/versions/26.2/run"

[nodes."26.2-neoforge".environment]
GLFW_PLATFORM = "x11"
XDG_SESSION_TYPE = "x11"
WAYLAND_DISPLAY = ""

